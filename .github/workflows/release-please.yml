name: release-please

on:
  # Release automation belongs to the upstream repository. This fork tracks
  # upstream and publishes nothing, and the default workflow token here is
  # read-only, so the action could only ever fail with "Resource not
  # accessible by integration". Run it on demand instead of on every push.
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
